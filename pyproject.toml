[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attools"
version = "0.4.0"
description = "파일 정리 / 백엔드 개발 / git / 엑셀 실무 / 일상 계산 / 소설 집필 자동화 CLI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
at = "attools.cli:main"

[tool.setuptools]
packages = ["attools"]

[tool.setuptools.package-data]
attools = ["data/*.json"]
