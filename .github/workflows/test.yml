name: 테스트

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 테스트
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: 모든 명령의 --help 가 뜨는지
        run: |
          python at --version
          python at --help > /dev/null
          for group in file dev git life sheet text doc json keys novel ui; do
            python at "$group" --help > /dev/null
          done

      - name: 시크릿 검사 (자기 자신에게)
        run: python at git scan --quiet

      - name: 문서 점검 (링크·이미지·제목)
        run: python at doc lint README.md --only-errors

      - name: 안 쓰는 import 검사 (자기 자신에게)
        run: python at dev unused attools tests

      # 3.10 에서만 깨지는 문법·표준 라이브러리를 미리 잡는다.
      - name: 지원 파이썬 판 검사 (자기 자신에게)
        run: python at dev pyver attools tests --target 3.10

      # 화면의 자바스크립트는 실제로 열어 보지 않으면 깨져도 시험이 통과한다.
      # 러너에 브라우저가 없으면 조용히 건너뛴다 - 없는 것을 실패로 세지 않는다.
      - name: 브라우저로 화면 점검
        run: |
          python at ui --check; code=$?
          if [ "$code" = "2" ]; then
            echo "이 러너에서는 화면을 열어 보지 못했습니다. 건너뜁니다."
          else
            exit "$code"
          fi
