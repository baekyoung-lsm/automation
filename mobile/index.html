<html lang="ko">

<title>월급과 장부</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">

<meta name="theme-color" content="#14181b" media="(prefers-color-scheme: dark)">

<body>
<style>
  :root {
    --ground: #eff1f3;
    --card: #ffffff;
    --sunk: #e6e9ec;
    --ink: #15191c;
    --ink-2: #5a646e;
    --ink-3: #8b959e;
    --rule: #d5dbe0;
    --accent: #1b4b6b;
    --accent-soft: #dce8f0;
    --out: #c2402b;
    --in: #0f6e5c;
    --warn: #8a5a12;
    --shadow: 0 1px 2px rgba(21, 25, 28, .07), 0 6px 18px rgba(21, 25, 28, .06);
    --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --display: "Gothic A1", "Noto Sans KR", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Menlo", monospace;
    --tab-h: 62px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14181b;
      --card: #1c2226;
      --sunk: #232b30;
      --ink: #e8ecef;
      --ink-2: #94a2ac;
      --ink-3: #6d7a83;
      --rule: #2c353b;
      --accent: #7fb2d4;
      --accent-soft: #223440;
      --out: #e8705a;
      --in: #46b79e;
      --warn: #d9a340;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #14181b;
    --card: #1c2226;
    --sunk: #232b30;
    --ink: #e8ecef;
    --ink-2: #94a2ac;
    --ink-3: #6d7a83;
    --rule: #2c353b;
    --accent: #7fb2d4;
    --accent-soft: #223440;
    --out: #e8705a;
    --in: #46b79e;
    --warn: #d9a340;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
  }

  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 15px; line-height: 1.55;
    -webkit-text-size-adjust: 100%; overscroll-behavior-y: none;
  }
  * { box-sizing: border-box; }
  button, input, select { font: inherit; color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------- 뼈대 */
  .wrap { min-height: 100%; padding: 0 16px calc(var(--tab-h) + 26px); max-width: 560px; margin: 0 auto; }
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--ground); padding-block: 12px 8px;
    border-bottom: 1px solid var(--rule); margin: 0 -16px; padding-inline: 16px;
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .brand h1 {
    font-family: var(--display); font-weight: 800; font-size: 19px;
    margin: 0; letter-spacing: -.02em;
  }
  .brand .sub { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; }
  .monthbar { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .monthbar .label {
    flex: 1; text-align: center; font-family: var(--display); font-weight: 700;
    font-size: 16px;
  }
  .stepper {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--rule);
    background: var(--card); cursor: pointer; font-size: 17px; line-height: 1;
    color: var(--ink-2);
  }
  .stepper:disabled { opacity: .35; }

  /* ---------------------------------------------------------- 카드 */
  .card {
    background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
    padding: 14px; margin-top: 12px;
  }
  .card > h2 {
    font-family: var(--display); font-weight: 700; font-size: 13px; margin: 0 0 10px;
    color: var(--ink-2); letter-spacing: .04em;
  }
  .card.flat { background: transparent; border: 0; padding: 0; }

  /* 이번 달 요약 - 이 화면의 주인공이라 유일하게 크게 쓴다 */
  .summary { box-shadow: var(--shadow); padding: 16px 16px 12px; }
  .summary .left-label { font-size: 12px; color: var(--ink-2); letter-spacing: .06em; }
  .summary .left-amount {
    font-family: var(--mono); font-weight: 700; font-size: 34px; letter-spacing: -.02em;
    margin: 2px 0 12px; font-variant-numeric: tabular-nums;
  }
  .summary .left-amount.minus { color: var(--out); }
  .inout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inout div { background: var(--sunk); border-radius: 10px; padding: 8px 10px; }
  .inout .k { font-size: 11px; color: var(--ink-2); }
  .inout .v { font-family: var(--mono); font-weight: 700; font-size: 16px; }
  .inout .v.plus { color: var(--in); }
  .inout .v.minus { color: var(--out); }

  /* 영수증식 줄: 이름 ...... 금액 */
  .line { display: flex; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--rule); }
  .line:last-child { border-bottom: 0; }
  .line .name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line .dots { flex: 1 1 auto; border-bottom: 1px dotted var(--rule); transform: translateY(-4px); min-width: 12px; }
  .line .amt { flex: none; font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; }
  .line .amt.plus { color: var(--in); }
  .line .amt.minus { color: var(--out); }
  .line .meta { font-size: 11px; color: var(--ink-3); }
  .line .day { flex: none; width: 34px; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

  .chip {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
  }

  /* 분류 막대 */
  .bar { height: 7px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

  .empty { color: var(--ink-3); font-size: 13px; padding: 14px 0; text-align: center; }
  .note { font-size: 12px; color: var(--ink-2); line-height: 1.6; }
  .note.warn { color: var(--warn); }

  /* ---------------------------------------------------------- 탭바 */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--card); border-top: 1px solid var(--rule);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabs button {
    border: 0; background: none; height: var(--tab-h); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; color: var(--ink-3); font-size: 11px; font-weight: 700;
  }
  nav.tabs button .ic { font-family: var(--mono); font-size: 15px; font-weight: 700; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); }
  .fab {
    position: fixed; right: 16px; z-index: 31;
    bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px));
    width: 58px; height: 58px; border-radius: 18px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--card); font-size: 27px; line-height: 1;
    box-shadow: var(--shadow); font-family: var(--mono); font-weight: 500;
  }

  /* ---------------------------------------------------------- 바텀시트 */
  .veil {
    position: fixed; inset: 0; z-index: 40; background: rgba(9, 13, 16, .5);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 560px; background: var(--card);
    border-radius: 18px 18px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    max-height: 88%; overflow-y: auto;
  }
  .sheet h2 { font-family: var(--display); font-size: 17px; margin: 2px 0 12px; }
  .grip { width: 38px; height: 4px; border-radius: 99px; background: var(--rule); margin: 0 auto 10px; }

  .seg { display: grid; grid-auto-flow: column; gap: 6px; background: var(--sunk); padding: 4px; border-radius: 12px; }
  .seg button {
    border: 0; background: none; padding: 9px 4px; border-radius: 9px; cursor: pointer;
    font-weight: 700; font-size: 13px; color: var(--ink-2);
  }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  label.f { display: block; margin-top: 12px; }
  label.f > span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px; }
  .in {
    width: 100%; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--rule);
    background: var(--ground); min-height: 46px;
  }
  .in:focus-visible, .stepper:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input.money { font-family: var(--mono); font-weight: 700; font-size: 22px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    border: 1px solid var(--rule); background: var(--ground); border-radius: 99px;
    padding: 8px 13px; cursor: pointer; font-size: 13px; min-height: 40px;
  }
  .chips button[aria-pressed="true"] { background: var(--accent); color: var(--card); border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .go {
    width: 100%; margin-top: 16px; padding: 15px; border-radius: 13px; border: 0;
    background: var(--accent); color: var(--card); font-weight: 700; font-size: 16px;
    cursor: pointer; font-family: var(--display);
  }
  .ghost {
    width: 100%; margin-top: 8px; padding: 12px; border-radius: 11px;
    border: 1px solid var(--rule); background: transparent; color: var(--ink-2);
    cursor: pointer; font-size: 14px;
  }
  .del { color: var(--out); border-color: var(--out); }
  textarea.out {
    width: 100%; height: 150px; font-family: var(--mono); font-size: 11px;
    border-radius: 11px; border: 1px solid var(--rule); background: var(--ground);
    padding: 10px; resize: vertical;
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
    bottom: calc(var(--tab-h) + 88px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 99px;
    font-size: 13px; font-weight: 700; box-shadow: var(--shadow);
  }
  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: rise .18s ease-out; }
    @keyframes rise { from { transform: translateY(14px); } }
  }
  .tri { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
  .tri b { font-family: var(--mono); font-size: 17px; }
  dl.kv { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 7px 10px; }
  dl.kv dt { font-size: 13px; color: var(--ink-2); min-width: 0; }
  dl.kv dd { margin: 0; font-family: var(--mono); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  dl.kv dt small { display: block; font-size: 11px; color: var(--ink-3); font-family: var(--body); }
  .total { border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 10px; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="pagetitle">월급과 장부</h1>
      <span class="sub" id="brandsub">오프라인 · 이 폰에만 저장</span>
    </div>
    <div class="monthbar" id="monthbar">
      <button class="stepper" id="prevm" aria-label="지난 달">&#8249;</button>
      <span class="label num" id="mlabel">2026년 9월</span>
      <button class="stepper" id="nextm" aria-label="다음 달">&#8250;</button>
    </div>
  </header>

  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="지출 넣기">+</button>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-ledger" aria-selected="true"><span class="ic">&#8361;</span>장부</button>
  <button role="tab" id="tab-fixed" aria-selected="false"><span class="ic">&#8942;&#8942;</span>고정비</button>
  <button role="tab" id="tab-pay" aria-selected="false"><span class="ic">&#8721;</span>월급</button>
</nav>

<div id="modal"></div>
<div id="toast"></div>

<script>
"use strict";

/* =============================================================== 저장 */
const KEY = "attools.jangbu.v1";
const 기본 = {
  거래: [], 고정비: [], 급여: null, 예시: true,
  분류: ["식비", "주거", "교통", "통신", "구독", "생활", "의료", "경조사", "기타"],
};
let DB = 기본;

function 읽기() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) DB = Object.assign({}, 기본, JSON.parse(raw));
  } catch (e) { DB = 기본; }
  if (DB.예시 && !DB.거래.length && !DB.고정비.length) 예시넣기();
}
function 쓰기() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { 알림("저장하지 못했습니다. 브라우저 저장공간을 확인하세요."); }
}

/* =============================================================== 날짜 */
const 오늘 = new Date();
function 달키(d) { return d.slice(0, 7); }
function 날짜글(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
let 보는달 = 날짜글(오늘).slice(0, 7);
function 달글(key) {
  const [y, m] = key.split("-");
  return Number(y) + "년 " + Number(m) + "월";
}
function 달더하기(key, n) {
  let [y, m] = key.split("-").map(Number);
  m += n;
  y += Math.floor((m - 1) / 12);
  m = ((m - 1) % 12 + 12) % 12 + 1;
  return y + "-" + String(m).padStart(2, "0");
}
function 달차이(a, b) {
  const [ay, am] = a.split("-").map(Number), [by, bm] = b.split("-").map(Number);
  return (by - ay) * 12 + (bm - am);
}

/* =============================================================== 숫자 */
function 돈(n) {
  const v = Math.round(Number(n) || 0);
  return v.toLocaleString("ko-KR");
}
function 숫자만(s) { return String(s).replace(/[^0-9-]/g, ""); }
function 금액읽기(s) { return Number(숫자만(s)) || 0; }

/* =============================================================== 예시 */
function 예시넣기() {
  const 이번 = 보는달, 지난 = 달더하기(이번, -1), 지지난 = 달더하기(이번, -2);
  const 거래 = [];
  [지지난, 지난, 이번].forEach((m) => {
    거래.push({ id: 아이디(), 날짜: m + "-25", 내용: "월급", 분류: "급여", 수입: true, 금액: 2810000 });
    거래.push({ id: 아이디(), 날짜: m + "-01", 내용: "월세", 분류: "주거", 수입: false, 금액: 450000 });
    거래.push({ id: 아이디(), 날짜: m + "-03", 내용: "넷플릭스", 분류: "구독", 수입: false, 금액: 17000 });
  });
  거래.push({ id: 아이디(), 날짜: 이번 + "-07", 내용: "장보기", 분류: "식비", 수입: false, 금액: 131000 });
  거래.push({ id: 아이디(), 날짜: 이번 + "-12", 내용: "주유", 분류: "교통", 수입: false, 금액: 60000 });
  DB.거래 = 거래;
  DB.고정비 = [
    { id: 아이디(), 이름: "월세", 분류: "주거", 금액: 450000, 주기: "월", 끝: "" },
    { id: 아이디(), 이름: "휴대폰 할부", 분류: "할부", 금액: 41000, 주기: "월", 끝: 달더하기(이번, 5) + "-28" },
    { id: 아이디(), 이름: "자동차보험", 분류: "보험", 금액: 780000, 주기: "년", 끝: "" },
    { id: 아이디(), 이름: "넷플릭스", 분류: "구독", 금액: 17000, 주기: "월", 끝: "" },
  ];
}
function 아이디() { return Math.random().toString(36).slice(2, 10); }

/* =============================================================== 장부 셈 */
function 이달거래(m) { return DB.거래.filter((t) => t.날짜.slice(0, 7) === m); }
function 달합(m) {
  let 수입 = 0, 지출 = 0;
  이달거래(m).forEach((t) => { if (t.수입) 수입 += t.금액; else 지출 += t.금액; });
  return { 수입, 지출, 남음: 수입 - 지출 };
}
function 분류별(m) {
  const 모음 = {};
  이달거래(m).filter((t) => !t.수입).forEach((t) => {
    const k = t.분류 || "기타";
    모음[k] = (모음[k] || 0) + t.금액;
  });
  return Object.entries(모음).sort((a, b) => b[1] - a[1]);
}
function 되풀이찾기(least) {
  const 모음 = {};
  DB.거래.filter((t) => !t.수입 && t.내용).forEach((t) => {
    (모음[t.내용] = 모음[t.내용] || []).push(t);
  });
  const out = [];
  for (const [이름, 건들] of Object.entries(모음)) {
    const 달 = [...new Set(건들.map((t) => t.날짜.slice(0, 7)))].sort();
    if (달.length < least) continue;
    let 길게 = 1, 이어서 = 1;
    for (let i = 1; i < 달.length; i++) {
      이어서 = 달차이(달[i - 1], 달[i]) === 1 ? 이어서 + 1 : 1;
      길게 = Math.max(길게, 이어서);
    }
    if (길게 < least) continue;
    const 값 = 건들.map((t) => t.금액);
    const 셈 = {};
    값.forEach((v) => { 셈[v] = (셈[v] || 0) + 1; });
    const 흔한 = Number(Object.entries(셈).sort((a, b) => b[1] - a[1])[0][0]);
    const 흔들림 = 셈[흔한] < 값.length;
    out.push({
      이름, 달수: 길게, 흔들림,
      금액: 흔들림 ? 값.reduce((a, b) => a + b, 0) / 값.length : 흔한,
      낮 : Math.min(...값), 높: Math.max(...값),
      이미: DB.고정비.some((f) => f.이름 === 이름),
    });
  }
  return out.sort((a, b) => b.금액 - a.금액);
}

/* =============================================================== 고정비 셈 */
const 주기배수 = { "월": 1, "년": 1 / 12, "주": 365 / 12 / 7, "분기": 1 / 3, "반기": 1 / 6 };
function 고정비셈() {
  const 이번 = 보는달;
  let 월 = 0;
  const 줄 = DB.고정비.map((f) => {
    const 끝난 = f.끝 && f.끝.slice(0, 7) < 이번;
    const 환산 = 끝난 ? 0 : f.금액 * (주기배수[f.주기] || 1);
    월 += 환산;
    return {
      ...f, 환산, 끝난,
      남은달: f.끝 && !끝난 ? Math.max(달차이(이번, f.끝.slice(0, 7)), 0) : null,
    };
