<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>손에 든 attools</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4b6b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181b" media="(prefers-color-scheme: dark)">
<meta name="description" content="attools 를 폰에서. 계산·장부·고정비·단축키·명령 찾기.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<style>
  :root {
    --ground: #eff1f3; --card: #ffffff; --sunk: #e6e9ec;
    --ink: #15191c; --ink-2: #5a646e; --ink-3: #8b959e; --rule: #d5dbe0;
    --accent: #1b4b6b; --accent-soft: #dce8f0;
    --out: #c2402b; --in: #0f6e5c; --warn: #8a5a12;
    --shadow: 0 1px 2px rgba(21,25,28,.07), 0 6px 18px rgba(21,25,28,.06);
    --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --display: "Gothic A1", "Noto Sans KR", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Menlo", monospace;
    --tab-h: 62px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14181b; --card: #1c2226; --sunk: #232b30;
      --ink: #e8ecef; --ink-2: #94a2ac; --ink-3: #6d7a83; --rule: #2c353b;
      --accent: #7fb2d4; --accent-soft: #223440;
      --out: #e8705a; --in: #46b79e; --warn: #d9a340;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #14181b; --card: #1c2226; --sunk: #232b30;
    --ink: #e8ecef; --ink-2: #94a2ac; --ink-3: #6d7a83; --rule: #2c353b;
    --accent: #7fb2d4; --accent-soft: #223440;
    --out: #e8705a; --in: #46b79e; --warn: #d9a340;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  }

  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 15px; line-height: 1.55;
    -webkit-text-size-adjust: 100%; overscroll-behavior-y: none;
  }
  * { box-sizing: border-box; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .wrap { min-height: 100%; padding: 0 16px calc(var(--tab-h) + 26px); max-width: 560px; margin: 0 auto; }
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--ground); padding-block: 12px 8px;
    border-bottom: 1px solid var(--rule); margin: 0 -16px; padding-inline: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .brand h1 {
    font-family: var(--display); font-weight: 800; font-size: 19px;
    margin: 0; letter-spacing: -.02em; flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .brand .sub { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; flex: none; }
  .back {
    flex: none; width: 34px; height: 34px; margin-left: -6px; border-radius: 10px;
    border: 1px solid var(--rule); background: var(--card); cursor: pointer;
    color: var(--ink-2); font-size: 17px; line-height: 1;
  }
  .monthbar { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .monthbar .label { flex: 1; text-align: center; font-family: var(--display); font-weight: 700; font-size: 16px; }
  .stepper {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--rule);
    background: var(--card); cursor: pointer; font-size: 17px; line-height: 1; color: var(--ink-2);
  }
  .search { margin-top: 8px; }
  .search input {
    width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px solid var(--rule);
    background: var(--card); min-height: 44px;
  }

  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .card > h2 { font-family: var(--display); font-weight: 700; font-size: 13px; margin: 0 0 10px; color: var(--ink-2); letter-spacing: .04em; }
  .card.flat { background: transparent; border: 0; padding: 0; }

  .summary { box-shadow: var(--shadow); padding: 16px 16px 12px; }
  .summary .left-label { font-size: 12px; color: var(--ink-2); letter-spacing: .06em; }
  .summary .left-amount {
    font-family: var(--mono); font-weight: 700; font-size: 32px; letter-spacing: -.02em;
    margin: 2px 0 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }
  .summary .left-amount.minus { color: var(--out); }
  .summary .left-amount .unit { font-size: 18px; }
  .inout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inout div { background: var(--sunk); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .inout .k { font-size: 11px; color: var(--ink-2); }
  .inout .v { font-family: var(--mono); font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
  .inout .v.plus { color: var(--in); }
  .inout .v.minus { color: var(--out); }

  .line { display: flex; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--rule); }
  .line:last-child { border-bottom: 0; }
  .line .name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line .dots { flex: 1 1 auto; border-bottom: 1px dotted var(--rule); transform: translateY(-4px); min-width: 12px; }
  .line .amt { flex: none; font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; }
  .line .amt.plus { color: var(--in); }
  .line .amt.minus { color: var(--out); }
  .line .meta { font-size: 11px; color: var(--ink-3); }
  .line .day { flex: none; width: 34px; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .bar { height: 7px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .empty { color: var(--ink-3); font-size: 13px; padding: 14px 0; text-align: center; }
  .note { font-size: 12px; color: var(--ink-2); line-height: 1.6; }
  .note.warn { color: var(--warn); }
  .cmd { font-family: var(--mono); font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* 도구 목록 */
  .tools { display: grid; gap: 1px; background: var(--rule); border-radius: 12px; overflow: hidden; border: 1px solid var(--rule); }
  .tools button {
    border: 0; background: var(--card); text-align: left; padding: 13px 14px; cursor: pointer;
    display: block; width: 100%; min-height: 54px;
  }
  .tools button .t { font-weight: 700; }
  .tools button .d { font-size: 12px; color: var(--ink-2); display: block; }
  .tools button .c { font-family: var(--mono); font-size: 11px; color: var(--ink-3); display: block; margin-top: 2px; overflow-wrap: anywhere; }
  .tools button[disabled] { background: var(--sunk); cursor: default; }
  .tools button[disabled] .t { color: var(--ink-2); font-weight: 500; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--card); border-top: 1px solid var(--rule);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabs button {
    border: 0; background: none; height: var(--tab-h); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; color: var(--ink-3); font-size: 11px; font-weight: 700;
  }
  nav.tabs button .ic { font-family: var(--mono); font-size: 15px; font-weight: 700; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); }
  .fab {
    position: fixed; right: 16px; z-index: 31;
    bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px));
    width: 58px; height: 58px; border-radius: 18px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--card); font-size: 27px; line-height: 1;
    box-shadow: var(--shadow); font-family: var(--mono); font-weight: 500;
  }

  .veil { position: fixed; inset: 0; z-index: 40; background: rgba(9,13,16,.5); display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    width: 100%; max-width: 560px; background: var(--card);
    border-radius: 18px 18px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    max-height: 88%; overflow-y: auto;
  }
  .sheet h2 { font-family: var(--display); font-size: 17px; margin: 2px 0 12px; }
  .grip { width: 38px; height: 4px; border-radius: 99px; background: var(--rule); margin: 0 auto 10px; }

  .seg { display: grid; grid-auto-flow: column; gap: 6px; background: var(--sunk); padding: 4px; border-radius: 12px; }
  .seg button { border: 0; background: none; padding: 9px 4px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  label.f { display: block; margin-top: 12px; }
  label.f > span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px; }
  label.f > span small { color: var(--ink-3); }
  .in { width: 100%; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--rule); background: var(--ground); min-height: 46px; }
  .in:focus-visible, .stepper:focus-visible, button:focus-visible, .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input.money { font-family: var(--mono); font-weight: 700; font-size: 20px; text-align: right; }
  textarea.in { min-height: 110px; font-family: var(--mono); font-size: 13px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--rule); background: var(--ground); border-radius: 99px; padding: 8px 13px; cursor: pointer; font-size: 13px; min-height: 40px; }
  .chips button[aria-pressed="true"] { background: var(--accent); color: var(--card); border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .go { width: 100%; margin-top: 16px; padding: 15px; border-radius: 13px; border: 0; background: var(--accent); color: var(--card); font-weight: 700; font-size: 16px; cursor: pointer; font-family: var(--display); }
  .ghost { width: 100%; margin-top: 8px; padding: 12px; border-radius: 11px; border: 1px solid var(--rule); background: transparent; color: var(--ink-2); cursor: pointer; font-size: 14px; }
  .del { color: var(--out); border-color: var(--out); }
  textarea.out { width: 100%; height: 150px; font-family: var(--mono); font-size: 11px; border-radius: 11px; border: 1px solid var(--rule); background: var(--ground); padding: 10px; resize: vertical; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
    bottom: calc(var(--tab-h) + 88px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 99px;
    font-size: 13px; font-weight: 700; box-shadow: var(--shadow); max-width: 88%; text-align: center;
  }
  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: rise .18s ease-out; }
    @keyframes rise { from { transform: translateY(14px); } }
  }
  dl.kv { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 7px 10px; }
  dl.kv dt { font-size: 13px; color: var(--ink-2); min-width: 0; }
  dl.kv dd { margin: 0; font-family: var(--mono); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  dl.kv dt small { display: block; font-size: 11px; color: var(--ink-3); font-family: var(--body); }
  .total { border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 10px; }
  .scroll { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
  table.grid { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  table.grid th, table.grid td { padding: 6px 9px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  table.grid th { font-size: 11px; color: var(--ink-2); font-weight: 700; }
  table.grid td.n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <button class="back" id="back" hidden aria-label="뒤로">&#8249;</button>
      <h1 id="pagetitle">손에 든 attools</h1>
      <span class="sub" id="brandsub">이 폰에만 저장</span>
    </div>
    <div class="monthbar" id="monthbar" hidden>
      <button class="stepper" id="prevm" aria-label="지난 달">&#8249;</button>
      <span class="label num" id="mlabel"></span>
      <button class="stepper" id="nextm" aria-label="다음 달">&#8250;</button>
    </div>
    <div class="search" id="searchbar" hidden>
      <input class="in" id="q" type="search" placeholder="하려는 일이나 명령 이름으로 찾기" autocomplete="off">
    </div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" hidden aria-label="넣기">+</button>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-tools" aria-selected="true"><span class="ic">&#8862;</span>도구</button>
  <button role="tab" id="tab-ledger" aria-selected="false"><span class="ic">&#8361;</span>장부</button>
  <button role="tab" id="tab-fixed" aria-selected="false"><span class="ic">&#8942;&#8942;</span>고정비</button>
  <button role="tab" id="tab-me" aria-selected="false"><span class="ic">&#9776;</span>더보기</button>
</nav>

<div id="modal"></div>
<div id="toast"></div>
<script>

function 단위바꾸기(글) {
  const t = String(글 || "").trim();
  const 온도 = t.match(/^(-?\d+(?:\.\d+)?)\s*(?:도)?\s*([cCfF])$/);
  if (온도) {

    return 온도[2].toLowerCase() === "c"
      ? { 그룹: "온도", 값: v, 단위: "C", 결과: [["F", v * 9 / 5 + 32]] }
      : { 그룹: "온도", 값: v, 단위: "F", 결과: [["C", (v - 32) * 5 / 9]] };
  }
  const m = t.match(/^(-?\d+(?:\.\d+)?)\s*([^\d\s]+)$/);
  if (!m) return null;
  const 값 = Number(m[1]), 단위 = m[2];
  for (const [그룹, 표] of Object.entries(단위표)) {

const 한글숫자 = "영일이삼사오육칠팔구";

const 큰단위 = ["", "만", "억", "조", "경"];
function 한글금액(값, 정식) {
  let n = Math.floor(Math.abs(Number(값) || 0));
  if (!n) return "영";
  const 조각 = [];
  let 자리 = 0;
  while (n > 0 && 자리 < 큰단위.length) {
    const 묶음 = n % 10000;
    if (묶음) {
      let 글 = "";
      String(묶음).split("").reverse().forEach((c, i) => {
        const d = Number(c);
        if (!d) return;
        글 = 한글숫자[d] + 작은단위[i] + 글;
        if (d === 1 && i > 0 && !정식) 글 = 작은단위[i] + 글.slice(2);
      });
      조각.unshift(글 + 큰단위[자리]);
    }
    n = Math.floor(n / 10000); 자리++;
  }
  return (Number(값) < 0 ? "마이너스 " : "") + 조각.join(" ");
}

  m = t.match(/^(\d{1,4})$/);
  if (m && t.length >= 3) return Number(t.slice(0, -2)) * 60 + Number(t.slice(-2));
  m = t.match(/^(?:(\d+)\s*시간?)?\s*(?:(\d+)\s*분)?$/);
  if (m && (m[1] || m[2])) return (Number(m[1]) || 0) * 60 + (Number(m[2]) || 0);
  return null;
}

/* --------------------------------------------------- 도구가 쓰는 잔 셈들 */
function 만나이(태어난, 오늘날) {
  let 해 = 오늘날.getFullYear() - 태어난.getFullYear();
  const 지났나 = (오늘날.getMonth() > 태어난.getMonth())
    || (오늘날.getMonth() === 태어난.getMonth() && 오늘날.getDate() >= 태어난.getDate());
  if (!지났나) 해 -= 1;
  return 해;
}
function 근속연수(입사, 기준) { return Math.max(만나이(입사, 기준), 0); }
function 개월차(입사, 기준) {
  let m = (기준.getFullYear() - 입사.getFullYear()) * 12 + 기준.getMonth() - 입사.getMonth();
  if (기준.getDate() < 입사.getDate()) m -= 1;
  return Math.max(m, 0);
}
function 연차누적(입사, 기준, 회계) {
  let 합 = 0;
  for (let k = 1; k <= 11; k++) {
    const d = new Date(입사.getFullYear(), 입사.getMonth() + k, 입사.getDate());
    if (d > 기준) break;
    합 += 1;
  }
  if (!회계) {
    for (let n = 1; ; n++) {
      const d = new Date(입사.getFullYear() + n, 입사.getMonth(), 입사.getDate());
      if (d > 기준) break;
      합 += Math.min(15 + Math.max(0, Math.floor((n - 1) / 2)), 25);
    }
    return 합;
  }
  let 첫 = new Date(입사.getFullYear(), 0, 1);
  if (첫 <= 입사) 첫 = new Date(입사.getFullYear() + 1, 0, 1);
  for (let step = 0; ; step++) {
    const d = new Date(첫.getFullYear() + step, 0, 1);
    if (d > 기준) break;
    if (step === 0) {
      const 잰날 = Math.round((d - 새날(입사)) / 86400000);
      합 += Math.min(Math.ceil(15 * 잰날 / 365), 15);
    } else {
      const 해 = Math.max(근속연수(입사, d), 1);
      합 += Math.min(15 + Math.max(0, Math.floor((해 - 1) / 2)), 25);
    }
  }
  return 합;
}
function csv읽기(글) {
  const 줄 = 글.split(/\r?\n/).filter((s) => s.trim());
  if (줄.length < 2) return null;
  const 쪼개 = (s) => {
    const out = []; let 칸 = "", 따옴 = false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (따옴) {
        if (c === '"' && s[i + 1] === '"') { 칸 += '"'; i++; }
        else if (c === '"') 따옴 = false;
        else 칸 += c;
      } else if (c === '"') 따옴 = true;
      else if (c === "," || c === "\t") { out.push(칸); 칸 = ""; }
      else 칸 += c;
    }
    out.push(칸);
    return out.map((x) => x.trim());
  };
  return { 머리: 쪼개(줄[0]), 줄: 줄.slice(1).map(쪼개) };
}

  document.getElementById("g-cancel").addEventListener("click", 시트닫기);

    DB.고정비 = DB.고정비.filter((x) => x.id !== id); 쓰기(); 시트닫기(); 그리기(); 알림("지웠습니다");

function 글시트(제목, 안내, 글, 읽기전용) {
  시트('<h2>' + esc(제목) + '</h2><p class="note">' + esc(안내) + '</p>'
    + '<textarea class="out" id="x-text"' + (읽기전용 ? " readonly" : "") + '>' + esc(글) + '</textarea>'
    + '<button class="go" id="x-go">' + (읽기전용 ? "복사하기" : "되살리기") + '</button>'
    + '<button class="ghost" id="x-cancel">닫기</button>');
  document.getElementById("x-cancel").addEventListener("click", 시트닫기);
  document.getElementById("x-go").addEventListener("click", () => {
    const el = document.getElementById("x-text");
    if (!읽기전용) { 되살리기(el.value); return; }
    el.select(); el.setSelectionRange(0, 999999);
    let 됐 = false;
    try { 됐 = document.execCommand("copy"); } catch (e) { 됐 = false; }
    if (됐) { 알림("복사했습니다"); return; }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(el.value).then(() => 알림("복사했습니다"))
        .catch(() => 알림("길게 눌러 직접 복사해 주세요"));
    } else 알림("길게 눌러 직접 복사해 주세요");
  });
}
function csv내보내기() {

function 되살리기(글) {

  try { 새 = JSON.parse(글); } catch (e) { 알림("json 으로 읽지 못했습니다"); return; }
